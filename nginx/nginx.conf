# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    # ── Docker embedded DNS — re-resolve container IPs every 10 s ──
    # Without this, nginx caches IPs at startup and returns 502
    # after containers are recreated with new IPs.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Upstream variables (resolved dynamically via Docker DNS)
    set $upstream_backend  http://backend:80;
    set $upstream_frontend http://frontend:3000;

    # Security headers
    add_header X-Frame-Options            "SAMEORIGIN"            always;
    add_header X-Content-Type-Options     "nosniff"               always;
    add_header X-XSS-Protection           "1; mode=block"         always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "geolocation=(), microphone=()" always;

    # Hide nginx version
    server_tokens off;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml+rss;

    # ── Disable Swagger in production (checked before /api/) ────
    location /api/swagger {
        return 403;
    }

    # ── Auth endpoints (stricter rate limit) ─────────────────
    location /api/Auth/ {
        limit_req zone=auth burst=5 nodelay;

        proxy_pass         $upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ── Backend API (general) ────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass         $upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ── Frontend (React SPA) ─────────────────────────────────
    location / {
        proxy_pass         $upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Health check (public) ────────────────────────────────
    location = /health {
        access_log off;
        rewrite ^ /api/health break;
        proxy_pass $upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Block common exploit paths
    location ~* \.(env|git|bak|sql|log|conf)$ {
        return 404;
    }
}
