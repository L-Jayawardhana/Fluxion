name: CI/CD — Build, Push & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/fluxion-api

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — Build & test backend
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  build-backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BackEnd/src

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: |
          dotnet restore Fluxion.API/Fluxion.API.csproj
          dotnet restore ../../tests/Fluxion.UnitTests/Fluxion.UnitTests.csproj
          dotnet restore ../../tests/Fluxion.IntegrationTests/Fluxion.IntegrationTests.csproj

      - name: Build
        run: |
          dotnet build Fluxion.API/Fluxion.API.csproj --configuration Release --no-restore
          dotnet build ../../tests/Fluxion.UnitTests/Fluxion.UnitTests.csproj --configuration Release --no-restore
          dotnet build ../../tests/Fluxion.IntegrationTests/Fluxion.IntegrationTests.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test ../../tests/Fluxion.UnitTests/Fluxion.UnitTests.csproj --configuration Release --no-build --verbosity normal
        continue-on-error: true  # remove once tests are fully written

      - name: Run integration tests
        run: dotnet test ../../tests/Fluxion.IntegrationTests/Fluxion.IntegrationTests.csproj --configuration Release --no-build --verbosity normal
        continue-on-error: true  # remove once tests are fully written

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2 — Build backend Docker image and push to Docker Hub
  # Frontends are handled by Vercel, so no frontend build needed here
  # ─────────────────────────────────────────────────────────────────────────
  docker-push:
    name: Build & Push Backend Docker Image
    runs-on: ubuntu-latest
    needs: [build-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata (short SHA tag)
        id: meta
        run: echo "version=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: BackEnd/src
          file: BackEnd/src/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 3 — Deploy backend to Azure VM over SSH
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy Backend to Azure VM
    runs-on: ubuntu-latest
    needs: docker-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy config files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,scripts/setup-vm-ssl.sh"
          target: "/opt/fluxion"
          strip_components: 0

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/fluxion

            # Log in to Docker Hub on the VM
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
              docker login docker.io -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

            # Write the .env file from GitHub Secrets (never committed to git)
            cat > .env <<EOF
            IMAGE_TAG=${{ needs.docker-push.outputs.image-tag }}
            DOCKER_REGISTRY=${{ secrets.DOCKERHUB_USERNAME }}
            DB_CONNECTION_STRING=${{ secrets.DB_CONNECTION_STRING }}
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            JWT_ISSUER=${{ secrets.JWT_ISSUER }}
            JWT_AUDIENCE=${{ secrets.JWT_AUDIENCE }}
            JWT_EXPIRY_MINUTES=${{ secrets.JWT_EXPIRY_MINUTES }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}
            SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
            SMTP_FROM_EMAIL=${{ secrets.SMTP_FROM_EMAIL }}
            SMTP_FROM_NAME=Fluxion
            SMTP_ENABLE_SSL=true
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            ALLOWED_ORIGIN_0=${{ secrets.ALLOWED_ORIGIN_0 }}
            ALLOWED_ORIGIN_1=${{ secrets.ALLOWED_ORIGIN_1 }}
            EOF

            # Ensure docker-compose v2 plugin is available, fall back to v1
            if ! docker compose version &>/dev/null 2>&1; then
              sudo apt-get update -qq && sudo apt-get install -y -qq docker-compose-plugin
            fi

            # Pull new images
            docker compose pull

            # Recreate all containers
            docker compose up -d --force-recreate --remove-orphans

            # Remove dangling images to save disk space
            docker image prune -f

            # Verify backend container is running
            sleep 15
            docker compose ps
