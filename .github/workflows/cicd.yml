name: CI/CD — Build, Push & Deploy

on:
  push:
    branches: [Dev]
  pull_request:
    branches: [Dev]

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/fluxion-api
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/fluxion-frontend
  JAVA_VERSION: "21"

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — Build & test backend
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  build-backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BackEnd/src

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore Fluxion.API/Fluxion.API.csproj

      - name: Build
        run: dotnet build Fluxion.API/Fluxion.API.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test ../tests/Fluxion.UnitTests/Fluxion.UnitTests.csproj --configuration Release --no-build --verbosity normal
        continue-on-error: true  # remove this line once tests are written

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2 — Build & test frontend
  # ─────────────────────────────────────────────────────────────────────────
  build-frontend:
    name: Build & Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FrontEnd/Fluxion

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: FrontEnd/Fluxion/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 3 — Selenium Smoke Tests (Java) — gate before Docker push
  # ─────────────────────────────────────────────────────────────────────────
  selenium-smoke:
    name: "🌐 Selenium Smoke Tests (Java)"
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: fluxion_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: FrontEnd/Fluxion/package.json

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install & serve frontend
        working-directory: FrontEnd/Fluxion
        run: |
          npm ci
          npm run build
          npx serve -s dist -l 5173 &

      - name: Build & start backend
        run: |
          dotnet build BackEnd/src/Fluxion.API/Fluxion.API.csproj --configuration Release
          dotnet run --project BackEnd/src/Fluxion.API/Fluxion.API.csproj \
            --configuration Release --no-build &
        env:
          ASPNETCORE_URLS: "http://+:5226"
          ConnectionStrings__DefaultConnection: "Server=localhost;Port=3306;Database=fluxion_test;User=root;Password=testpassword;"
          JwtSettings__SecretKey: "GitHubActionsTestSecretKeyThatIs256BitsLong!!"
          JwtSettings__Issuer: "FluxionTest"
          JwtSettings__Audience: "FluxionTestUsers"

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:5226/api/health && break
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done

      - name: Run Selenium Smoke Tests
        run: |
          mvn test \
            -Dselenium.baseUrl=http://localhost:5173 \
            -Dselenium.apiBaseUrl=http://localhost:5226/api \
            -Dselenium.headless=true \
            -Dselenium.screenshotDir=target/screenshots \
            --batch-mode
        working-directory: tests/selenium-smoke

      - name: Upload Smoke Test Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-smoke-results
          path: |
            tests/selenium-smoke/target/surefire-reports/
            tests/selenium-smoke/target/screenshots/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 4 — Build Docker images and push to Docker Hub (Dev branch push only)
  # ─────────────────────────────────────────────────────────────────────────
  docker-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [selenium-smoke]
    if: github.ref == 'refs/heads/Dev' && github.event_name == 'push'

    permissions:
      contents: read

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata (short SHA tag)
        id: meta
        run: echo "version=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: BackEnd/src
          file: BackEnd/src/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: FrontEnd/Fluxion
          file: FrontEnd/Fluxion/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 4 — Deploy to Azure VM over SSH
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: docker-push
    if: github.ref == 'refs/heads/Dev' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout code (for docker-compose.yml and nginx config)
        uses: actions/checkout@v4

      - name: Copy nginx config to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          source: "nginx/nginx.conf,docker-compose.yml"
          target: "/opt/fluxion"
          strip_components: 0

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/fluxion

            # Log in to Docker Hub on the VM
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
              docker login docker.io -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

            # Write the .env file from GitHub Secrets (never committed to git)
            cat > .env <<EOF
            IMAGE_TAG=${{ needs.docker-push.outputs.image-tag }}
            DOCKER_REGISTRY=${{ secrets.DOCKERHUB_USERNAME }}
            DB_CONNECTION_STRING=${{ secrets.DB_CONNECTION_STRING }}
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            JWT_ISSUER=${{ secrets.JWT_ISSUER }}
            JWT_AUDIENCE=${{ secrets.JWT_AUDIENCE }}
            JWT_EXPIRY_MINUTES=${{ secrets.JWT_EXPIRY_MINUTES }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}
            SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
            SMTP_FROM_EMAIL=${{ secrets.SMTP_FROM_EMAIL }}
            SMTP_FROM_NAME=Fluxion
            SMTP_ENABLE_SSL=true
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            EOF

            # Ensure docker-compose v2 plugin is available, fall back to v1
            if ! docker compose version &>/dev/null 2>&1; then
              sudo apt-get update -qq && sudo apt-get install -y -qq docker-compose-plugin
            fi

            # Pull new images
            docker compose pull

            # Recreate all containers (ensures nginx picks up new backend/frontend IPs)
            docker compose up -d --force-recreate --remove-orphans

            # Remove dangling images to save disk space
            docker image prune -f

            # Verify all containers are healthy
            sleep 15
            docker compose ps
