name: QA Pipeline

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: "0 3 * * *"   # 3 AM UTC daily (full regression)
  workflow_dispatch:        # manual trigger

env:
  DOTNET_VERSION: "8.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  JAVA_VERSION: "21"

jobs:
  # ══════════════════════════════════════════════════════════════════════
  # Unit Tests — runs on every PR and push
  # ══════════════════════════════════════════════════════════════════════
  unit-tests:
    name: "🧪 Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore BackEnd/Fluxion.sln

      - name: Build
        run: dotnet build BackEnd/Fluxion.sln --configuration Release --no-restore

      - name: Run Unit Tests
        run: |
          dotnet test tests/Fluxion.UnitTests/Fluxion.UnitTests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=unit-results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults/UnitTests

      - name: Upload Unit Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: TestResults/UnitTests/
          retention-days: 14

  # ══════════════════════════════════════════════════════════════════════
  # Integration Tests — runs on every PR and push
  # ══════════════════════════════════════════════════════════════════════
  integration-tests:
    name: "🔗 Integration Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore BackEnd/Fluxion.sln

      - name: Build
        run: dotnet build BackEnd/Fluxion.sln --configuration Release --no-restore

      - name: Run Integration Tests
        run: |
          dotnet test tests/Fluxion.IntegrationTests/Fluxion.IntegrationTests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=integration-results.trx" \
            --results-directory TestResults/IntegrationTests

      - name: Upload Integration Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: TestResults/IntegrationTests/
          retention-days: 14

  # ══════════════════════════════════════════════════════════════════════
  # Selenium Smoke Tests (Java + JUnit 5) — runs on EVERY push/PR
  # Fast UI smoke checks: page-load, form validation, auth-guard.
  # No pre-seeded users or email verification required.
  # ══════════════════════════════════════════════════════════════════════
  selenium-smoke:
    name: "🌐 Selenium Smoke Tests (Java)"
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: fluxion_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      # ── Java (for Maven + Selenium tests) ──────────────────────────
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # ── .NET (for backend) ─────────────────────────────────────────
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ── Node.js (for frontend) ─────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: FrontEnd/Fluxion/package.json

      # ── Chrome ────────────────────────────────────────────────────
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # ── Frontend ──────────────────────────────────────────────────
      - name: Install frontend dependencies
        run: npm ci
        working-directory: FrontEnd/Fluxion

      - name: Build & serve frontend
        run: |
          npm run build
          npx serve -s dist -l 5173 &
        working-directory: FrontEnd/Fluxion

      # ── Backend ───────────────────────────────────────────────────
      - name: Build & start backend
        run: |
          dotnet build BackEnd/src/Fluxion.API/Fluxion.API.csproj --configuration Release
          dotnet run --project BackEnd/src/Fluxion.API/Fluxion.API.csproj \
            --configuration Release --no-build &
        env:
          ASPNETCORE_URLS: "http://+:5226"
          ConnectionStrings__DefaultConnection: "Server=localhost;Port=3306;Database=fluxion_test;User=root;Password=testpassword;"
          JwtSettings__SecretKey: "GitHubActionsTestSecretKeyThatIs256BitsLong!!"
          JwtSettings__Issuer: "FluxionTest"
          JwtSettings__Audience: "FluxionTestUsers"

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:5226/api/health && break
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          curl -sf http://localhost:5173 || echo "Frontend check — may not expose /health"

      # ── Java Selenium Smoke Tests ─────────────────────────────────
      - name: Run Selenium Smoke Tests (Java)
        run: |
          mvn test \
            -Dselenium.baseUrl=http://localhost:5173 \
            -Dselenium.apiBaseUrl=http://localhost:5226/api \
            -Dselenium.headless=true \
            -Dselenium.screenshotDir=target/screenshots \
            --batch-mode
        working-directory: tests/selenium-smoke

      - name: Upload Smoke Test Reports & Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-smoke-results
          path: |
            tests/selenium-smoke/target/surefire-reports/
            tests/selenium-smoke/target/screenshots/
          retention-days: 14

  # ══════════════════════════════════════════════════════════════════════
  # Nightly trigger is defined in the `on:` block above (schedule + workflow_dispatch)
  # ══════════════════════════════════════════════════════════════════════
