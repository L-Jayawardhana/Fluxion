services:
  # ── Nginx Reverse Proxy (public entry point) ─────────────
  nginx:
    image: nginx:alpine
    container_name: fluxion-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - fluxion-network

  # ── Backend .NET API ──────────────────────────────────────
  backend:
    image: ${DOCKER_REGISTRY}/fluxion-api:${IMAGE_TAG:-latest}
    container_name: fluxion-backend
    restart: unless-stopped
    # NOT exposed to host — only reachable inside docker network via nginx
    expose:
      - "80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - JwtSettings__Issuer=${JWT_ISSUER:-Fluxion}
      - JwtSettings__Audience=${JWT_AUDIENCE:-FluxionUsers}
      - JwtSettings__ExpiryMinutes=${JWT_EXPIRY_MINUTES:-60}
      - SmtpSettings__Host=${SMTP_HOST:-smtp.gmail.com}
      - SmtpSettings__Port=${SMTP_PORT:-465}
      - SmtpSettings__Username=${SMTP_USERNAME}
      - SmtpSettings__Password=${SMTP_PASSWORD}
      - SmtpSettings__FromEmail=${SMTP_FROM_EMAIL}
      - SmtpSettings__FromName=${SMTP_FROM_NAME:-Fluxion}
      - SmtpSettings__EnableSsl=${SMTP_ENABLE_SSL:-true}
      - GoogleAuth__ClientId=${GOOGLE_CLIENT_ID}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - fluxion-network

  # ── Frontend React/Vite SPA ───────────────────────────────
  frontend:
    image: ${DOCKER_REGISTRY}/fluxion-frontend:${IMAGE_TAG:-latest}
    container_name: fluxion-frontend
    restart: unless-stopped
    # NOT exposed to host — only reachable inside docker network via nginx
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    networks:
      - fluxion-network

networks:
  fluxion-network:
    driver: bridge
